server {
    listen 0.0.0.0:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads up to 11MB (API limit is 10MB)
    client_max_body_size 11m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Local health check (no dependency on API)
    location = /ping {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests via public URL (avoids stale DNS cache when API redeploys)
    location /api {
        proxy_pass https://api-production-659d.up.railway.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host api-production-659d.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploads
    location /uploads {
        proxy_pass https://api-production-659d.up.railway.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api-production-659d.up.railway.app;
    }

    # Health check
    location /health {
        proxy_pass https://api-production-659d.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host api-production-659d.up.railway.app;
    }
}
