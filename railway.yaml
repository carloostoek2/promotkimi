services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3001
    envs:
      - DATABASE_URL
      - REDIS_URL
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - NODE_ENV
      - PORT
      - WEB_URL
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - 80
    envs:
      - VITE_API_URL

volumes:
  uploads:
